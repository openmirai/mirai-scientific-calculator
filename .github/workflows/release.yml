name: Release

on:
  workflow_dispatch:
    inputs:
      npm_only:
        description: Retry only npm publication after a partial release
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish committed core version
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://calculator.openmirai.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HUSKY: "0"

    steps:
      - name: Check out main with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release existing package version
        if: ${{ !inputs.npm_only }}
        run: pnpm release

      - name: Recover npm publication after a partial release
        if: ${{ inputs.npm_only }}
        run: >-
          pnpm --dir packages/calculator-core exec release-it
          --config ../../.release-it.json
          --ci --no-increment --no-git --no-github
